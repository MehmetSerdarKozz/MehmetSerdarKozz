name: Profile summary cards

# GitHub istatistik kartlarını her gün bu depoda üretir (profile-summary-card-output/).
# Kartlar depoda durduğu için dış bir servis çökse bile profilde kırık görsel oluşmaz.
on:
  schedule:
    - cron: "0 3 * * *" # her gün 03:00 UTC (06:00 Türkiye)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Europe/Istanbul"
